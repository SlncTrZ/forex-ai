[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forex-ai"
version = "0.1.0"
description = "Account-neutral deterministic Forex research and guarded trading system"
requires-python = ">=3.12"
dependencies = [
  "mt5linux==1.1.1",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "PyYAML>=6,<7",
  "httpx>=0.28,<1",
  "tenacity>=9,<10",
  "python-dotenv>=1.2,<2",
  "numpy>=2.5,<3",
  "pandas>=3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
